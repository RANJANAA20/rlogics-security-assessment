name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  security-events: write # Required for uploading SARIF results to GitHub Security tab
  id-token: write         # Required for keyless Cosign signing

jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir -r app-or-lab-target/requirements.txt
          pip install semgrep

      # --- 1. SAST (Semgrep) ---
      - name: Run Semgrep SAST
        run: |
          mkdir -p sast
          semgrep scan --config auto app-or-lab-target/ --json > sast/semgrep-results.json || echo "Semgrep found issues"
          # Gating condition: Fail build if critical/high issues are found (or let semgrep handle exit codes)
          semgrep scan --config auto app-or-lab-target/

      # --- 2. Dependency & Filesystem Scan (Trivy) ---
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app-or-lab-target/'
          format: 'json'
          output: 'container-scan/trivy-fs-results.json'
          severity: 'CRITICAL,HIGH'

      # --- 3. SBOM Generation ---
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app-or-lab-target/'
          format: 'cyclonedx'
          output: 'container-scan/sbom.json'

      # --- 4. Container Build & Image Scan ---
      - name: Build Docker Image
        run: docker build -t devsecops-lab:latest app-or-lab-target/

      - name: Run Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-lab:latest'
          format: 'table'
          exit-code: '1' # Gating: Fails pipeline on vulnerability match
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # --- 5. DAST (OWASP ZAP) ---
      - name: Start App in Background
        run: |
          python app-or-lab-target/app.py &
          sleep 3 # Wait for server to spin up

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:5000/'
          rules_file_name: ''
          fail_action: false # Set to true if you want ZAP failures to block pipeline

      # --- 6. Artifact Signing (Cosign) ---
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image (Keyless / Test)
        # In production, use OIDC keyless signing or secret keys
        run: |
          echo "Simulating container signing flow..."
          cosign version

      # --- 7. Upload Audit Evidence & Reports ---
      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-audit-evidence
          path: |
            sast/
            container-scan/
            dast/
