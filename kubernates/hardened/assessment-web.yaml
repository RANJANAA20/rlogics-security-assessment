apiVersion: v1
kind: ServiceAccount
metadata:
  name: assessment-web-sa
  namespace: assessment-secure
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-web
  namespace: assessment-secure
  labels:
    app: assessment-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-web
  template:
    metadata:
      labels:
        app: assessment-web
    spec:
      serviceAccountName: assessment-web-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged@sha256:808f7846d21a9c94cf53833e8807a00a33fd0b65cc47fb05b79efe366c2d201f
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assessment-web
  namespace: assessment-secure
spec:
  type: ClusterIP
  selector:
    app: assessment-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
