apiVersion: v1
kind: Pod
metadata:
  name: kyverno-allowed
  namespace: kyverno-test
spec:
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged@sha256:808f7846d21a9c94cf53833e8807a00a33fd0b65cc47fb05b79efe366c2d201f
      securityContext:
        privileged: false
        runAsNonRoot: true
        runAsUser: 101
        allowPrivilegeEscalation: false
