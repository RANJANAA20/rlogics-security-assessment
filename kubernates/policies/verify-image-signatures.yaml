apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  background: false
  validationFailureAction: Enforce
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kyverno-test
      verifyImages:
        - imageReferences:
            - "docker.io/ranjanaa20y/kyverno-cosign-lab*"
          required: true
          verifyDigest: true
          mutateDigest: true
          failureAction: Enforce
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAERaiE8q5JihuIf+sygKKGqIysLXv7
                      vXKq70MyAHbeVqLjKJIo3JWG5xHH88vGUyO6HfJ1BH2nusjq+P9FKMlBVw==
                      -----END PUBLIC KEY-----
